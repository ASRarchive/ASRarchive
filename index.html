<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Índice de Páginas</title>
  <style>
    :root {
      --bg-bar: #ffffff;
      --bg-toc: #fafafa;
      --bg-sidebar: #ffffff;
      --bg-hover: #f0f1f4;
      --bg-active: #fdf2f4;
      --bg-canvas: #f8f9fa;
      --text-primary: #111827;
      --text-secondary: #6b7280;
      --border-color: #e5e7eb;
      --accent: #7a1c2e;
      --accent-secondary: #c2591b;
      --shadow: 0 10px 25px rgba(0, 0, 0, 0.14);
      --backdrop: rgba(0, 0, 0, 0.45);
    }

    body.dark-mode {
      --bg-bar: #121214;
      --bg-toc: #17171a;
      --bg-sidebar: #161619;
      --bg-hover: #25252b;
      --bg-active: #2d161b;
      --bg-canvas: #0d0d0f;
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --border-color: #2c2c34;
      --accent: #8f2237;
      --accent-secondary: #d96b27;
      --shadow: 0 12px 30px rgba(0, 0, 0, 0.55);
      --backdrop: rgba(0, 0, 0, 0.68);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100vh;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* Cabeçalho Fixo no Topo (Barra + Menu Horizontal de Títulos) */
    .top-header {
      flex-shrink: 0;
      background-color: var(--bg-bar);
      border-bottom: 1px solid var(--border-color);
      z-index: 100;
      transition: background-color 0.2s, border-color 0.2s, color 0.2s;
    }

    .topbar {
      height: 48px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 10px;
    }

    .menu-btn {
      width: 36px;
      height: 36px;
      border: 1px solid var(--border-color);
      background: transparent;
      color: var(--text-primary);
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      flex-shrink: 0;
      transition: background-color 0.15s;
    }

    .menu-btn:hover {
      background-color: var(--bg-hover);
    }

    .menu-btn span {
      display: block;
      width: 17px;
      height: 2px;
      background-color: currentColor;
      border-radius: 2px;
    }

    .current-page-title {
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-primary);
      flex: 1;
    }

    /* Menu Horizontal Rolante de Títulos (H1, H2) no Topo */
    .toc-horizontal-bar {
      background-color: var(--bg-toc);
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      overflow-x: auto;
      overflow-y: hidden;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .toc-horizontal-bar::-webkit-scrollbar {
      height: 4px;
    }

    .toc-horizontal-bar::-webkit-scrollbar-thumb {
      background-color: var(--border-color);
      border-radius: 3px;
    }

    .toc-empty {
      font-size: 12.5px;
      color: var(--text-secondary);
      padding: 2px 2px;
    }

    .toc-item {
      flex-shrink: 0;
      background-color: var(--bg-bar);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-primary);
      cursor: pointer;
      padding: 5px 11px;
      line-height: 1.3;
      white-space: nowrap;
      transition: background-color 0.15s, border-color 0.15s, color 0.15s;
    }

    .toc-item:hover {
      background-color: var(--bg-hover);
    }

    .toc-item.active {
      background-color: var(--bg-active);
      border-color: var(--accent);
    }

    .toc-item.level-h1 {
      font-size: 13px;
      font-weight: 700;
      border-left: 3px solid var(--accent);
    }

    .toc-item.level-h2 {
      font-size: 12.5px;
      font-weight: 400;
      color: var(--text-secondary);
    }

    .toc-item.level-h2:hover,
    .toc-item.level-h2.active {
      color: var(--text-primary);
    }

    /* Overlay & Menu Lateral (Estilo Twitter/X, sobrepondo) */
    .sidebar-backdrop {
      position: fixed;
      inset: 0;
      background-color: var(--backdrop);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.22s ease, visibility 0.22s ease;
      z-index: 200;
    }

    .sidebar-backdrop.open {
      opacity: 1;
      visibility: visible;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: min(300px, 82vw);
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      box-shadow: var(--shadow);
      transform: translateX(-100%);
      transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.2s;
      z-index: 250;
      display: flex;
      flex-direction: column;
    }

    .sidebar.open {
      transform: translateX(0);
    }

    .sidebar-header {
      height: 48px;
      padding: 0 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .sidebar-header-title {
      font-size: 16px;
      font-weight: 700;
    }

    .close-sidebar-btn {
      width: 34px;
      height: 34px;
      border: none;
      background: transparent;
      color: var(--text-primary);
      font-size: 22px;
      line-height: 1;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .close-sidebar-btn:hover {
      background-color: var(--bg-hover);
    }

    .sidebar-options {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .dark-mode-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 0;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-primary);
      cursor: pointer;
      user-select: none;
    }

    .switch {
      position: relative;
      width: 40px;
      height: 22px;
      background-color: var(--border-color);
      border-radius: 999px;
      transition: background-color 0.2s;
    }

    .switch::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background-color: #ffffff;
      transition: transform 0.2s;
    }

    body.dark-mode .switch {
      background-color: var(--accent);
    }

    body.dark-mode .switch::after {
      transform: translateX(18px);
    }

    /* Lista de Páginas (Somente nomes, sem ícones) */
    .page-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
      padding: 8px;
    }

    .page-list-empty {
      padding: 20px 12px;
      font-size: 13px;
      color: var(--text-secondary);
      text-align: center;
      line-height: 1.45;
    }

    .page-item {
      border-radius: 8px;
      margin-bottom: 2px;
      transition: background-color 0.15s;
    }

    .page-item:hover {
      background-color: var(--bg-hover);
    }

    .page-item.active {
      background-color: var(--bg-active);
    }

    .page-select-btn {
      width: 100%;
      background: transparent;
      border: none;
      text-align: left;
      padding: 11px 12px;
      font-size: 14.5px;
      font-weight: 500;
      color: var(--text-primary);
      cursor: pointer;
      display: block;
      word-break: break-word;
      line-height: 1.35;
    }

    .page-item.active .page-select-btn {
      font-weight: 700;
      color: var(--accent);
    }

    body.dark-mode .page-item.active .page-select-btn {
      color: var(--accent-secondary);
    }

    /* Área Principal de Visualização */
    .viewer-container {
      flex: 1;
      min-height: 0;
      position: relative;
      background-color: var(--bg-canvas);
    }

    /* O iframe mantém o layout e cores originais dos HTMLs carregados intactos */
    #page-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
      background-color: #ffffff;
    }

    #page-frame.visible {
      display: block;
    }

    .empty-state {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      gap: 10px;
    }

    .empty-state.hidden {
      display: none;
    }

    .empty-state h2 {
      font-size: 18px;
      font-weight: 700;
    }

    .empty-state p {
      font-size: 14px;
      color: var(--text-secondary);
      max-width: 380px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <!-- Topo: Barra Principal + Menu Horizontal Rolante de Títulos (H1, H2) -->
  <header class="top-header">
    <div class="topbar">
      <button type="button" class="menu-btn" id="open-sidebar-btn" aria-label="Abrir menu lateral">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <div class="current-page-title" id="current-page-title">Carregando...</div>
    </div>

    <nav class="toc-horizontal-bar" id="toc-list" aria-label="Atalhos de títulos da página"></nav>
  </header>

  <!-- Fundo escuro ao abrir menu lateral -->
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <!-- Menu Lateral (Estilo Twitter/X, sobrepondo) -->
  <aside class="sidebar" id="sidebar" aria-label="Menu de páginas">
    <div class="sidebar-header">
      <span class="sidebar-header-title">Páginas</span>
      <button type="button" class="close-sidebar-btn" id="close-sidebar-btn" aria-label="Fechar menu">×</button>
    </div>

    <div class="sidebar-options">
      <div class="dark-mode-row" id="dark-mode-toggle" role="switch" aria-checked="false" tabindex="0">
        <span>Modo escuro (menus)</span>
        <div class="switch"></div>
      </div>
    </div>

    <ul class="page-list" id="page-list"></ul>
  </aside>

  <!-- Área de Leitura -->
  <main class="viewer-container">
    <div class="empty-state" id="empty-state">
      <h2>Nenhuma página configurada</h2>
      <p>Adicione seus arquivos HTML na lista <strong>PAGINAS</strong> dentro do código deste index.html.</p>
    </div>
    <iframe id="page-frame" title="Conteúdo da página"></iframe>
  </main>

  <script>
    // =========================================================================
    // CONFIGURAÇÃO DAS PÁGINAS DO SITE
    // =========================================================================
    // Coloque abaixo os arquivos HTML que estão na mesma pasta deste index.html.
    // Você pode usar:
    //   { nome: "Nome exibido no menu", arquivo: "pagina1.html" }
    // Ou apenas o nome do arquivo direto:
    //   "pagina1.html"
    //
    // A primeira página da lista será aberta automaticamente ao acessar o site.
    // =========================================================================
    const PAGINAS = [
      { nome: "1980s", arquivo: "1980s.html" },
      { nome: "1990s", arquivo: "1990s.html" },
      { nome: "2000s", arquivo: "2000s.html" }
    
      // Adicione mais linhas seguindo o mesmo padrão:
      // ,{ nome: "Página 3", arquivo: "pagina3.html" }
    ];
    // =========================================================================

    (function () {
      // Normaliza a lista configurada acima
      const pages = PAGINAS.map((item, idx) => {
        if (typeof item === 'string') {
          const cleanName = item.split('/').pop().replace(/\.html?$/i, '') || item;
          return { id: 'p-' + idx, name: cleanName, file: item };
        }
        return {
          id: 'p-' + idx,
          name: item.nome || item.name || item.arquivo || item.file,
          file: item.arquivo || item.file
        };
      }).filter((p) => Boolean(p.file));

      let activePageId = null;
      let darkMode = false;

      // Referências DOM
      const openSidebarBtn = document.getElementById('open-sidebar-btn');
      const closeSidebarBtn = document.getElementById('close-sidebar-btn');
      const sidebar = document.getElementById('sidebar');
      const sidebarBackdrop = document.getElementById('sidebar-backdrop');
      const pageList = document.getElementById('page-list');
      const currentPageTitle = document.getElementById('current-page-title');
      const tocList = document.getElementById('toc-list');
      const darkModeToggle = document.getElementById('dark-mode-toggle');
      const emptyState = document.getElementById('empty-state');
      const pageFrame = document.getElementById('page-frame');

      // Preferência de modo escuro salva localmente
      function applyDarkMode(enabled) {
        darkMode = Boolean(enabled);
        document.body.classList.toggle('dark-mode', darkMode);
        darkModeToggle.setAttribute('aria-checked', String(darkMode));
        try {
          localStorage.setItem('site-index-dark-mode', darkMode ? '1' : '0');
        } catch (_) {}
      }

      darkModeToggle.addEventListener('click', () => applyDarkMode(!darkMode));
      darkModeToggle.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          applyDarkMode(!darkMode);
        }
      });

      // Controle do Menu Lateral
      function openSidebar() {
        sidebar.classList.add('open');
        sidebarBackdrop.classList.add('open');
      }

      function closeSidebar() {
        sidebar.classList.remove('open');
        sidebarBackdrop.classList.remove('open');
      }

      openSidebarBtn.addEventListener('click', openSidebar);
      closeSidebarBtn.addEventListener('click', closeSidebar);
      sidebarBackdrop.addEventListener('click', closeSidebar);

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeSidebar();
      });

      // Renderizar lista de páginas na lateral (somente nomes, sem ícones)
      function renderPageList() {
        pageList.innerHTML = '';

        if (pages.length === 0) {
          const emptyLi = document.createElement('li');
          emptyLi.className = 'page-list-empty';
          emptyLi.textContent = 'Nenhuma página configurada.';
          pageList.appendChild(emptyLi);
          return;
        }

        pages.forEach((page) => {
          const li = document.createElement('li');
          li.className = 'page-item' + (page.id === activePageId ? ' active' : '');

          const selectBtn = document.createElement('button');
          selectBtn.type = 'button';
          selectBtn.className = 'page-select-btn';
          selectBtn.textContent = page.name;
          selectBtn.addEventListener('click', () => {
            selectPage(page.id);
            closeSidebar();
          });

          li.appendChild(selectBtn);
          pageList.appendChild(li);
        });
      }

      // Carregar página da mesma pasta no iframe e mapear H1, H2 e hyperlinks internos
      function selectPage(pageId, targetAnchor = null) {
        const page = pages.find((p) => p.id === pageId);
        if (!page) return;

        activePageId = page.id;
        currentPageTitle.textContent = page.name;
        document.title = page.name;
        emptyState.classList.add('hidden');
        pageFrame.classList.add('visible');
        renderPageList();

        pageFrame.onload = function () {
          try {
            const doc = pageFrame.contentDocument;
            if (!doc) return;

            buildHorizontalHeadingsBar(doc);
            setupInternalLinks(doc);

            if (targetAnchor) {
              scrollToTarget(doc, targetAnchor, false);
            }
          } catch (err) {
            tocList.innerHTML = '<div class="toc-empty">Não foi possível ler os títulos desta página.</div>';
            console.error('Erro ao ler estrutura da página:', err);
          }
        };

        pageFrame.src = page.file;
      }

      function scrollToTarget(doc, targetId, smooth = true) {
        if (!targetId) {
          pageFrame.contentWindow.scrollTo({ top: 0, behavior: smooth ? 'smooth' : 'auto' });
          return true;
        }
        const byId = doc.getElementById(targetId);
        const byName = !byId ? doc.querySelector(`[name="${CSS.escape(targetId)}"]`) : null;
        const target = byId || byName;
        if (target) {
          target.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'start' });
          return true;
        }
        return false;
      }

      // Ler H1 e H2 da página carregada e montar o menu horizontal rolante no topo
      function buildHorizontalHeadingsBar(doc) {
        tocList.innerHTML = '';
        tocList.scrollLeft = 0;

        const headings = Array.from(doc.querySelectorAll('h1, h2')).filter(
          (el) => el.textContent && el.textContent.trim().length > 0
        );

        if (headings.length === 0) {
          const emptyMsg = document.createElement('div');
          emptyMsg.className = 'toc-empty';
          emptyMsg.textContent = 'Nenhum título H1 ou H2 encontrado nesta página.';
          tocList.appendChild(emptyMsg);
          return;
        }

        headings.forEach((heading, idx) => {
          if (!heading.id) {
            heading.id = 'index-sec-' + idx;
          }

          const level = heading.tagName.toLowerCase();
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = `toc-item level-${level}`;
          btn.textContent = heading.textContent.trim();

          btn.addEventListener('click', () => {
            tocList.querySelectorAll('.toc-item.active').forEach((el) => el.classList.remove('active'));
            btn.classList.add('active');
            btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            heading.scrollIntoView({ behavior: 'smooth', block: 'start' });
          });

          tocList.appendChild(btn);
        });
      }

      // Preservar hyperlinks internos (âncoras #id / name e links para outras páginas da lista)
      function setupInternalLinks(doc) {
        doc.addEventListener('click', (e) => {
          const link = e.target.closest('a[href]');
          if (!link) return;

          const href = (link.getAttribute('href') || '').trim();
          if (!href) return;

          // Atalho interno na mesma página (#titulo)
          if (href.startsWith('#')) {
            e.preventDefault();
            const rawId = href.slice(1);
            let decodedId = rawId;
            try {
              decodedId = decodeURIComponent(rawId);
            } catch (_) {}
            scrollToTarget(doc, decodedId, true);
            return;
          }

          // Caso um link interno aponte para outro arquivo HTML configurado em PAGINAS
          if (!/^(https?:|mailto:|tel:|javascript:)/i.test(href)) {
            const [filePart, hashPart] = href.split('#');
            const cleanTarget = filePart.replace(/^\.\//, '').toLowerCase();
            const targetFilename = cleanTarget.split('/').pop();

            if (targetFilename) {
              const matchedPage = pages.find((p) => {
                const cfgClean = p.file.replace(/^\.\//, '').toLowerCase();
                const cfgFilename = cfgClean.split('/').pop();
                return cfgClean === cleanTarget || cfgFilename === targetFilename;
              });

              if (matchedPage) {
                e.preventDefault();
                let anchor = null;
                if (hashPart) {
                  try {
                    anchor = decodeURIComponent(hashPart);
                  } catch (_) {
                    anchor = hashPart;
                  }
                }
                selectPage(matchedPage.id, anchor);
              }
            }
          }
        });
      }

      // Inicialização
      function init() {
        try {
          if (localStorage.getItem('site-index-dark-mode') === '1') {
            applyDarkMode(true);
          }
        } catch (_) {}

        renderPageList();

        if (pages.length > 0) {
          selectPage(pages[0].id);
        } else {
          currentPageTitle.textContent = 'Nenhuma página';
        }
      }

      init();
    })();
  </script>
</body>
</html>
