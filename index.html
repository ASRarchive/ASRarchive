<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASRarchive</title>
  <style>
    :root {
      --bg-bar: #ffffff;
      --bg-toc: #fafafa;
      --bg-sidebar: #ffffff;
      --bg-hover: #f0f1f4;
      --bg-active: #fdf2f4;
      --bg-canvas: #f8f9fa;
      --text-primary: #111827;
      --text-secondary: #6b7280;
      --border-color: #e5e7eb;
      --accent: #7a1c2e;
      --accent-hover: #5e1422;
      --accent-secondary: #c2591b;
      --accent-text: #ffffff;
      --shadow: 0 10px 25px rgba(0, 0, 0, 0.14);
      --backdrop: rgba(0, 0, 0, 0.45);
    }

    body.dark-mode {
      --bg-bar: #121214;
      --bg-toc: #17171a;
      --bg-sidebar: #161619;
      --bg-hover: #25252b;
      --bg-active: #2d161b;
      --bg-canvas: #0d0d0f;
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --border-color: #2c2c34;
      --accent: #8f2237;
      --accent-hover: #a82942;
      --accent-secondary: #d96b27;
      --accent-text: #ffffff;
      --shadow: 0 12px 30px rgba(0, 0, 0, 0.55);
      --backdrop: rgba(0, 0, 0, 0.68);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100vh;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* Cabeçalho Fixo no Topo (Barra + Linha Horizontal de Títulos) */
    .top-header {
      flex-shrink: 0;
      background-color: var(--bg-bar);
      border-bottom: 1px solid var(--border-color);
      z-index: 100;
      transition: background-color 0.2s, border-color 0.2s, color 0.2s;
    }

    .topbar {
      height: 48px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 10px;
    }

    .menu-btn {
      width: 36px;
      height: 36px;
      border: 1px solid var(--border-color);
      background: transparent;
      color: var(--text-primary);
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      flex-shrink: 0;
      transition: background-color 0.15s;
    }

    .menu-btn:hover {
      background-color: var(--bg-hover);
    }

    .menu-btn span {
      display: block;
      width: 17px;
      height: 2px;
      background-color: currentColor;
      border-radius: 2px;
    }

    .current-page-title {
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-primary);
      flex: 1;
    }

    /* Menu Horizontal Rolante de Títulos (H1, H2) no Topo */
    .toc-horizontal-bar {
      background-color: var(--bg-toc);
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      overflow-x: auto;
      overflow-y: hidden;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .toc-horizontal-bar::-webkit-scrollbar {
      height: 4px;
    }

    .toc-horizontal-bar::-webkit-scrollbar-thumb {
      background-color: var(--border-color);
      border-radius: 3px;
    }

    .toc-empty {
      font-size: 12.5px;
      color: var(--text-secondary);
      padding: 2px 2px;
    }

    .toc-item {
      flex-shrink: 0;
      background-color: var(--bg-bar);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-primary);
      cursor: pointer;
      padding: 5px 11px;
      line-height: 1.3;
      white-space: nowrap;
      transition: background-color 0.15s, border-color 0.15s, color 0.15s;
    }

    .toc-item:hover {
      background-color: var(--bg-hover);
    }

    .toc-item.active {
      background-color: var(--bg-active);
      border-color: var(--accent);
    }

    .toc-item.level-h1 {
      font-size: 13px;
      font-weight: 700;
      border-left: 3px solid var(--accent);
    }

    .toc-item.level-h2 {
      font-size: 12.5px;
      font-weight: 400;
      color: var(--text-secondary);
    }

    .toc-item.level-h2:hover,
    .toc-item.level-h2.active {
      color: var(--text-primary);
    }

    /* Overlay & Menu Lateral (Estilo Twitter/X, sobrepondo) */
    .sidebar-backdrop {
      position: fixed;
      inset: 0;
      background-color: var(--backdrop);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.22s ease, visibility 0.22s ease;
      z-index: 200;
    }

    .sidebar-backdrop.open {
      opacity: 1;
      visibility: visible;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: min(310px, 84vw);
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      box-shadow: var(--shadow);
      transform: translateX(-100%);
      transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.2s;
      z-index: 250;
      display: flex;
      flex-direction: column;
    }

    .sidebar.open {
      transform: translateX(0);
    }

    .sidebar-header {
      height: 48px;
      padding: 0 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .sidebar-header-title {
      font-size: 16px;
      font-weight: 700;
    }

    .close-sidebar-btn {
      width: 34px;
      height: 34px;
      border: none;
      background: transparent;
      color: var(--text-primary);
      font-size: 22px;
      line-height: 1;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .close-sidebar-btn:hover {
      background-color: var(--bg-hover);
    }

    .sidebar-actions {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .dark-mode-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 4px 2px;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-primary);
      cursor: pointer;
      user-select: none;
    }

    .switch {
      position: relative;
      width: 40px;
      height: 22px;
      background-color: var(--border-color);
      border-radius: 999px;
      transition: background-color 0.2s;
    }

    .switch::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background-color: #ffffff;
      transition: transform 0.2s;
    }

    body.dark-mode .switch {
      background-color: var(--accent);
    }

    body.dark-mode .switch::after {
      transform: translateX(18px);
    }

    /* Menu lateral: só o item fixo "INÍCIO" */
    .page-list {
      list-style: none;
      flex: none;
      padding: 4px 8px 0;
    }

    .page-item {
      border-radius: 8px;
      margin-bottom: 2px;
      transition: background-color 0.15s;
    }

    .page-item:hover {
      background-color: var(--bg-hover);
    }

    .page-item.active {
      background-color: var(--bg-active);
    }

    .page-select-btn {
      width: 100%;
      background: transparent;
      border: none;
      text-align: left;
      padding: 10px 10px;
      font-size: 14.5px;
      font-weight: 700;
      color: var(--text-primary);
      cursor: pointer;
      display: block;
      word-break: break-word;
      line-height: 1.35;
    }

    .page-item.active .page-select-btn {
      color: var(--accent);
    }

    body.dark-mode .page-item.active .page-select-btn {
      color: var(--accent-secondary);
    }

    /* Área Principal de Visualização */
    .viewer-container {
      flex: 1;
      min-height: 0;
      position: relative;
      background-color: var(--bg-canvas);
    }

    /* O iframe mantém o fundo branco padrão do navegador para não alterar o layout das páginas */
    #page-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background-color: #ffffff;
    }
  </style>
</head>
<body>

  <!-- Topo: Barra Principal + Linha Horizontal Permanente de Títulos (H1, H2) -->
  <header class="top-header">
    <div class="topbar">
      <button type="button" class="menu-btn" id="open-sidebar-btn" aria-label="Abrir menu lateral">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <div class="current-page-title" id="current-page-title">Início</div>
    </div>

    <nav class="toc-horizontal-bar" id="toc-list" aria-label="Atalhos de títulos da página"></nav>
  </header>

  <!-- Fundo escuro ao abrir menu lateral -->
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <!-- Menu Lateral (Estilo Twitter/X, sobrepondo) -->
  <aside class="sidebar" id="sidebar" aria-label="Menu de páginas">
    <div class="sidebar-header">
      <span class="sidebar-header-title">Páginas</span>
      <button type="button" class="close-sidebar-btn" id="close-sidebar-btn" aria-label="Fechar menu">×</button>
    </div>

    <div class="sidebar-actions">
      <div class="dark-mode-row" id="dark-mode-toggle" role="switch" aria-checked="false" tabindex="0">
        <span>Modo escuro (menus)</span>
        <div class="switch"></div>
      </div>
    </div>

    <ul class="page-list" id="pinned-page-list">
      <li class="page-item" id="home-page-item">
        <button type="button" class="page-select-btn" id="home-select-btn">INÍCIO</button>
      </li>
    </ul>
  </aside>

  <!-- Área de Leitura -->
  <main class="viewer-container" id="viewer-container">
    <iframe id="page-frame" title="Conteúdo da página"></iframe>
  </main>


  <!-- =====================================================================
       1) CONFIGURAÇÃO DAS PÁGINAS DO SITE   <<<  É AQUI QUE VOCÊ ADICIONA PÁGINAS
       =====================================================================
       Este bloco é separado do resto do código de propósito: se você errar
       uma vírgula ou uma aspa aqui, o site continua abrindo e mostra um aviso
       na tela INÍCIO dizendo que a lista tem erro (em vez de ficar tudo em branco).
       ===================================================================== -->
  <script>
    // =====================================================================
    // CONFIGURAÇÃO DAS PÁGINAS DO SITE
    // =====================================================================
    // COMO ADICIONAR UMA PÁGINA NOVA (3 passos):
    //
    //   1) Coloque o arquivo .html da página na MESMA PASTA deste index.html
    //      (no GitHub, suba o arquivo junto com o index.html).
    //
    //   2) Adicione UMA linha nova na lista abaixo, no formato:
    //
    //        { nome: "Nome exibido na INÍCIO e no topo", arquivo: "nomedoarquivo.html" },
    //
    //      - "nome"    = o texto que aparece como link na página INÍCIO e no topo da tela.
    //      - "arquivo" = o nome do arquivo EXATAMENTE como está na pasta
    //                    (maiúsculas e minúsculas contam! "Derby.html" é diferente de "DERBY.html",
    //                     e acento no nome do arquivo costuma dar problema: prefira sem acento).
    //
    //   3) Salve e suba o index.html atualizado. Pronto: a página INÍCIO se atualiza sozinha,
    //      não precisa mexer em mais nenhum lugar do código.
    //
    // REGRAS DA LISTA (onde mais dá erro):
    //   - A ordem da lista é a ordem em que os links aparecem na página INÍCIO.
    //   - Toda linha termina com vírgula, EXCETO a última (antes do colchete de fechamento ]).
    //   - Nome e arquivo ficam sempre entre aspas "assim".
    //   - Para REMOVER uma página, apague a linha dela (ou coloque // na frente para desativar).
    //
    // ATALHO: se o nome exibido puder ser igual ao nome do arquivo (sem o .html),
    // você pode escrever só o arquivo entre aspas, por exemplo:  "pagina1.html",
    // =====================================================================
    const PAGINAS = [
      { nome: "1980s",     arquivo: "1980s.html" },
      { nome: "1990s",     arquivo: "1990s.html" },
      { nome: "2000s",     arquivo: "2000s.html" },
      { nome: "ÍDOLOS",    arquivo: "IDOLOS.html" },
      { nome: "JOGADORES", arquivo: "JOGADORES.html" },
      { nome: "DERBY",     arquivo: "DERBY.html" }

      // Adicione mais linhas seguindo o mesmo padrão (lembre da vírgula na linha de cima!):
      // ,{ nome: "Página 3", arquivo: "pagina3.html" }
    ];
    // =====================================================================
  </script>

  <!-- 3) Código do site (não precisa mexer) -->
  <script>
    (function () {
      // -------------------------------------------------------------------
      // ESTADO
      // -------------------------------------------------------------------
      const HOME_PAGE_ID = '__home__';
      const DARK_MODE_KEY = 'asrarchive-dark-mode';

      const state = {
        pages: [],            // [{ id, slug, nome, arquivo }]
        activePageId: null,
        darkMode: false,
        configError: null
      };

      // Controla o que está carregado no iframe e qual âncora abrir após o onload
      let displayedId = null;
      let pendingAnchor = null;

      // -------------------------------------------------------------------
      // REFERÊNCIAS DO DOM
      // -------------------------------------------------------------------
      const openSidebarBtn = document.getElementById('open-sidebar-btn');
      const closeSidebarBtn = document.getElementById('close-sidebar-btn');
      const sidebar = document.getElementById('sidebar');
      const sidebarBackdrop = document.getElementById('sidebar-backdrop');
      const homePageItem = document.getElementById('home-page-item');
      const homeSelectBtn = document.getElementById('home-select-btn');
      const currentPageTitle = document.getElementById('current-page-title');
      const tocList = document.getElementById('toc-list');
      const darkModeToggle = document.getElementById('dark-mode-toggle');
      const pageFrame = document.getElementById('page-frame');

      // -------------------------------------------------------------------
      // LEITURA DA LISTA "PAGINAS"
      // -------------------------------------------------------------------
      function nomeDoArquivoSemExtensao(arquivo) {
        return String(arquivo).split('/').pop().replace(/\.html?$/i, '');
      }

      function carregarListaDePaginas() {
        if (typeof PAGINAS === 'undefined') {
          state.configError = 'A lista PAGINAS não foi carregada. Provavelmente há um erro de digitação nela (vírgula, aspas ou colchete faltando).';
          return;
        }
        if (!Array.isArray(PAGINAS)) {
          state.configError = 'PAGINAS precisa ser uma lista entre colchetes [ ... ].';
          return;
        }

        const avisos = [];

        PAGINAS.forEach((item, i) => {
          let nome = '';
          let arquivo = '';

          if (typeof item === 'string') {
            arquivo = item.trim();
            nome = nomeDoArquivoSemExtensao(arquivo);
          } else if (item && typeof item === 'object') {
            arquivo = String(item.arquivo || '').trim();
            nome = String(item.nome || '').trim() || nomeDoArquivoSemExtensao(arquivo);
          }

          if (!arquivo) {
            avisos.push('Item ' + (i + 1) + ' da lista PAGINAS está sem "arquivo" e foi ignorado.');
            return;
          }

          const slug = nomeDoArquivoSemExtensao(arquivo);
          state.pages.push({
            id: 'pagina-' + i,
            slug: slug,
            nome: nome,
            arquivo: arquivo
          });
        });

        if (avisos.length > 0) {
          console.warn(avisos.join('\n'));
        }
      }

      // -------------------------------------------------------------------
      // MODO ESCURO (somente menus)
      // -------------------------------------------------------------------
      function applyDarkMode(enabled) {
        state.darkMode = Boolean(enabled);
        document.body.classList.toggle('dark-mode', state.darkMode);
        darkModeToggle.setAttribute('aria-checked', String(state.darkMode));
        try {
          localStorage.setItem(DARK_MODE_KEY, state.darkMode ? '1' : '0');
        } catch (_) {}
      }

      function lerModoEscuroSalvo() {
        try {
          return localStorage.getItem(DARK_MODE_KEY) === '1';
        } catch (_) {
          return false;
        }
      }

      darkModeToggle.addEventListener('click', () => {
        applyDarkMode(!state.darkMode);
      });

      darkModeToggle.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          applyDarkMode(!state.darkMode);
        }
      });

      // -------------------------------------------------------------------
      // MENU LATERAL
      // -------------------------------------------------------------------
      function openSidebar() {
        sidebar.classList.add('open');
        sidebarBackdrop.classList.add('open');
      }

      function closeSidebar() {
        sidebar.classList.remove('open');
        sidebarBackdrop.classList.remove('open');
      }

      openSidebarBtn.addEventListener('click', openSidebar);
      closeSidebarBtn.addEventListener('click', closeSidebar);
      sidebarBackdrop.addEventListener('click', closeSidebar);

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeSidebar();
      });

      homeSelectBtn.addEventListener('click', () => {
        navigateTo(HOME_PAGE_ID, null);
        closeSidebar();
      });

      function atualizarItemAtivoDoMenu() {
        homePageItem.classList.toggle('active', state.activePageId === HOME_PAGE_ID);
      }

      // -------------------------------------------------------------------
      // PÁGINA INÍCIO
      // -------------------------------------------------------------------
      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      const ESTILO_DAS_TELAS_INTERNAS = `
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background-color: #0a0a0a;
    color: #f4f4f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 24px 72px;
    text-align: center;
    min-height: 100%;
  }
  .home-title {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #f4f4f5;
    text-align: center;
    margin-bottom: 32px;
  }
  .home-logos {
    max-width: 640px;
    width: 100%;
    height: auto;
    margin-bottom: 44px;
  }
  .home-links {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
  }
  .home-links a {
    color: #fbbf24;
    text-decoration: underline;
    text-underline-offset: 3px;
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .home-links a:hover { color: #f59e0b; }
  .home-empty {
    color: #a1a1aa;
    font-size: 0.95rem;
    margin-top: 4px;
    max-width: 420px;
    line-height: 1.5;
  }
  .home-error {
    color: #fca5a5;
    font-size: 0.95rem;
    margin-top: 4px;
    max-width: 420px;
    line-height: 1.5;
  }
  .home-hint {
    color: #a1a1aa;
    font-size: 0.85rem;
    margin-top: 14px;
    max-width: 420px;
    line-height: 1.55;
  }
  .home-hint code { color: #fbbf24; word-break: break-all; }`;

      function buildHomePageHtml() {
        let corpo;

        if (state.configError) {
          corpo = '<p class="home-error">' + escapeHtml(state.configError) + '</p>' +
                  '<p class="home-hint">Abra o index.html e confira o bloco <code>CONFIGURAÇÃO DAS PÁGINAS DO SITE</code>.</p>';
        } else if (state.pages.length === 0) {
          corpo = '<p class="home-empty">Nenhuma página cadastrada ainda.</p>';
        } else {
          corpo = '<nav class="home-links">\n' +
            state.pages.map((p) =>
              '        <a href="' + escapeHtml(p.arquivo) + '">' + escapeHtml(p.nome) + '</a>'
            ).join('\n') +
            '\n      </nav>';
        }

        return '<!DOCTYPE html>\n<html lang="pt-BR">\n<head>\n<meta charset="UTF-8">\n<title>Início</title>\n<style>' +
          ESTILO_DAS_TELAS_INTERNAS +
          '\n</style>\n</head>\n<body>\n  <p class="home-title">Início</p>\n' +
          '  <img class="home-logos" src="data:image/webp;base64,' + HOME_LOGO_BASE64 + '" alt="Escudos da AS Roma">\n  ' +
          corpo + '\n</body>\n</html>';
      }

      // -------------------------------------------------------------------
      // SINCRONIZAÇÃO COM URL HASH (#pagina e #pagina/ancora)
      // -------------------------------------------------------------------
      function buildHashForRoute(pageId, anchor) {
        if (pageId === HOME_PAGE_ID) {
          return '#inicio';
        }
        const page = state.pages.find((p) => p.id === pageId);
        if (!page) return '#inicio';

        let hash = '#' + encodeURIComponent(page.slug);
        if (anchor) {
          hash += '/' + encodeURIComponent(anchor);
        }
        return hash;
      }

      function parseCurrentHash() {
        const raw = (window.location.hash || '').replace(/^#/, '').trim();
        if (!raw || raw.toLowerCase() === 'inicio') {
          return { pageId: HOME_PAGE_ID, anchor: null };
        }

        // Aceita tanto #1980s/secao quanto #1980s#secao
        const match = raw.match(/^([^/#]+)(?:[/#](.+))?$/);
        if (!match) {
          return { pageId: HOME_PAGE_ID, anchor: null };
        }

        let pageToken = match[1];
        try {
          pageToken = decodeURIComponent(pageToken);
        } catch (_) {}

        let anchorToken = match[2] || null;
        if (anchorToken) {
          try {
            anchorToken = decodeURIComponent(anchorToken);
          } catch (_) {}
        }

        const key = pageToken.toLowerCase();
        const matchedPage = state.pages.find((p) =>
          p.slug.toLowerCase() === key ||
          p.arquivo.split('/').pop().toLowerCase() === key ||
          p.nome.toLowerCase() === key
        );

        if (!matchedPage) {
          return { pageId: HOME_PAGE_ID, anchor: null };
        }

        return { pageId: matchedPage.id, anchor: anchorToken };
      }

      // Dispara a mudança na barra de endereço (gera histórico para o botão Voltar)
      function navigateTo(pageId, anchor = null) {
        const targetHash = buildHashForRoute(pageId, anchor);

        // Se o hash já é exatamente esse, aplica a rolagem direto sem duplicar histórico
        if (window.location.hash === targetHash) {
          selectPage(pageId, anchor);
          return;
        }

        window.location.hash = targetHash;
      }

      function handleHashChange() {
        const route = parseCurrentHash();
        selectPage(route.pageId, route.anchor);
      }

      window.addEventListener('hashchange', handleHashChange);

      // -------------------------------------------------------------------
      // CARREGAMENTO NATIVO NO IFRAME (SEM FETCH / SEM DUPLICAÇÃO EM RAM)
      // -------------------------------------------------------------------
      pageFrame.addEventListener('load', () => {
        // Caso 1: Tela INÍCIO (usa srcdoc)
        if (state.activePageId === HOME_PAGE_ID) {
          tocList.innerHTML = '';
          tocList.scrollLeft = 0;
          try {
            const doc = pageFrame.contentDocument;
            if (doc) setupInternalLinks(doc);
          } catch (_) {}
          return;
        }

        // Caso 2: Página HTML carregada nativamente via pageFrame.src
        let doc = null;
        try {
          doc = pageFrame.contentDocument;
        } catch (_) {
          doc = null;
        }

        // Em modo offline restrito (file:// em alguns navegadores Android),
        // o iframe exibe a página normalmente, mas bloqueia leitura do DOM externo.
        if (!doc) {
          tocList.innerHTML = '';
          const msg = document.createElement('div');
          msg.className = 'toc-empty';
          msg.textContent = 'Atalhos de títulos indisponíveis em modo local restrito (file://).';
          tocList.appendChild(msg);
          return;
        }

        try {
          buildHorizontalHeadingsBar(doc);
          setupInternalLinks(doc);

          if (pendingAnchor) {
            const anchorToOpen = pendingAnchor;
            pendingAnchor = null;
            scrollToTarget(doc, anchorToOpen, false);
            highlightTocButtonById(anchorToOpen);
          }
        } catch (err) {
          console.error('Erro ao ler a estrutura da página:', err);
        }
      });

      function selectHomePage() {
        state.activePageId = HOME_PAGE_ID;
        currentPageTitle.textContent = 'Início';
        atualizarItemAtivoDoMenu();
        pendingAnchor = null;
        displayedId = HOME_PAGE_ID;

        // Remove src antes de definir srcdoc para garantir renderização limpa
        pageFrame.removeAttribute('src');
        pageFrame.srcdoc = buildHomePageHtml();
      }

      function selectPage(pageId, targetAnchor = null) {
        if (pageId === HOME_PAGE_ID) {
          selectHomePage();
          return;
        }

        const page = state.pages.find((p) => p.id === pageId);
        if (!page) {
          selectHomePage();
          return;
        }

        state.activePageId = page.id;
        currentPageTitle.textContent = page.nome;
        atualizarItemAtivoDoMenu();

        // Se a página já está carregada no iframe, apenas rola até a seção sem recarregar
        if (displayedId === page.id) {
          try {
            const doc = pageFrame.contentDocument;
            if (doc && doc.body) {
              scrollToTarget(doc, targetAnchor, true);
              highlightTocButtonById(targetAnchor);
              return;
            }
          } catch (_) {
            // Se file:// bloquear leitura do DOM e houver âncora, recarrega com #ancora nativo
            if (targetAnchor) {
              pageFrame.removeAttribute('srcdoc');
              pageFrame.src = page.arquivo + '#' + encodeURIComponent(targetAnchor);
            }
            return;
          }
        }

        displayedId = page.id;
        pendingAnchor = targetAnchor;

        // Remove srcdoc antes de definir src (se srcdoc permanecer, o navegador ignora src)
        pageFrame.removeAttribute('srcdoc');
        pageFrame.src = targetAnchor
          ? page.arquivo + '#' + encodeURIComponent(targetAnchor)
          : page.arquivo;
      }

      function scrollToTarget(doc, targetId, smooth = true) {
        const win = pageFrame.contentWindow;
        if (!targetId) {
          if (win) win.scrollTo({ top: 0, behavior: smooth ? 'smooth' : 'auto' });
          return true;
        }
        const byId = doc.getElementById(targetId);
        const byName = !byId ? doc.querySelector('[name="' + CSS.escape(targetId) + '"]') : null;
        const target = byId || byName;
        if (target) {
          target.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'start' });
          return true;
        }
        return false;
      }

      function highlightTocButtonById(targetId) {
        const buttons = tocList.querySelectorAll('.toc-item');
        buttons.forEach((btn) => {
          const isMatch = Boolean(targetId) && btn.dataset.targetId === targetId;
          btn.classList.toggle('active', isMatch);
          if (isMatch) {
            btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
          }
        });
      }

      // Ler H1 e H2 da página carregada e montar o menu horizontal rolante no topo
      function buildHorizontalHeadingsBar(doc) {
        tocList.innerHTML = '';
        tocList.scrollLeft = 0;

        const headings = Array.from(doc.querySelectorAll('h1, h2')).filter(
          (el) => el.textContent && el.textContent.trim().length > 0
        );

        if (headings.length === 0) {
          const emptyMsg = document.createElement('div');
          emptyMsg.className = 'toc-empty';
          emptyMsg.textContent = 'Nenhum título H1 ou H2 encontrado nesta página.';
          tocList.appendChild(emptyMsg);
          return;
        }

        headings.forEach((heading, idx) => {
          if (!heading.id) {
            heading.id = 'index-sec-' + idx;
          }

          const level = heading.tagName.toLowerCase();
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'toc-item level-' + level;
          btn.textContent = heading.textContent.trim();
          btn.dataset.targetId = heading.id;

          btn.addEventListener('click', () => {
            if (state.activePageId && state.activePageId !== HOME_PAGE_ID) {
              navigateTo(state.activePageId, heading.id);
            } else {
              highlightTocButtonById(heading.id);
              heading.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          });

          tocList.appendChild(btn);
        });
      }

      // Procura na lista PAGINAS o arquivo correspondente a um link
      function encontrarPaginaPorArquivo(nomeDoArquivo) {
        let alvo = nomeDoArquivo;
        try {
          alvo = decodeURIComponent(nomeDoArquivo);
        } catch (_) {}
        alvo = alvo.toLowerCase();

        return state.pages.find((p) => {
          const arquivo = p.arquivo.split('/').pop().toLowerCase();
          const porNome = (p.nome + '.html').toLowerCase();
          return arquivo === alvo || porNome === alvo;
        });
      }

      // Intercepta cliques em links internos para manter navegação e hash sincronizados
      function setupInternalLinks(doc) {
        doc.addEventListener('click', (e) => {
          const link = e.target.closest('a[href]');
          if (!link) return;

          const href = (link.getAttribute('href') || '').trim();
          if (!href) return;

          // Atalho dentro da mesma página (#titulo)
          if (href.startsWith('#')) {
            e.preventDefault();
            const rawId = href.slice(1);
            let decodedId = rawId;
            try {
              decodedId = decodeURIComponent(rawId);
            } catch (_) {}

            if (state.activePageId && state.activePageId !== HOME_PAGE_ID) {
              navigateTo(state.activePageId, decodedId);
            } else {
              scrollToTarget(doc, decodedId, true);
            }
            return;
          }

          // Links relativos para páginas do próprio site
          if (!/^(https?:|mailto:|tel:|javascript:)/i.test(href)) {
            const partes = href.split('#');
            const filePart = partes[0];
            const hashPart = partes[1];
            const nomeDoArquivo = filePart.split('?')[0].split('/').pop();

            // Evita abrir o próprio index.html aninhado dentro do iframe
            if (nomeDoArquivo && nomeDoArquivo.toLowerCase() === 'index.html') {
              e.preventDefault();
              navigateTo(HOME_PAGE_ID, null);
              return;
            }

            if (nomeDoArquivo) {
              const matchedPage = encontrarPaginaPorArquivo(nomeDoArquivo);

              if (matchedPage) {
                e.preventDefault();
                let anchor = null;
                if (hashPart) {
                  try {
                    anchor = decodeURIComponent(hashPart);
                  } catch (_) {
                    anchor = hashPart;
                  }
                }
                navigateTo(matchedPage.id, anchor);
              }
            }
          }
        });
      }

      // -------------------------------------------------------------------
      // INICIALIZAÇÃO: respeita o hash da URL se o link já vier com seção
      // -------------------------------------------------------------------
      function init() {
        applyDarkMode(lerModoEscuroSalvo());
        carregarListaDePaginas();
        handleHashChange();
      }

      init();
    })();
  </script>
</body>
